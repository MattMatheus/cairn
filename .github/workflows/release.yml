name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -X cairn/internal/cli.Version=${VERSION}" -o dist/cairn.exe ./cmd/cairn
            (cd dist && zip "cairn_${GOOS}_${GOARCH}.zip" cairn.exe)
            rm dist/cairn.exe
          else
            go build -trimpath -ldflags "-s -w -X cairn/internal/cli.Version=${VERSION}" -o dist/cairn ./cmd/cairn
            tar -C dist -czf "dist/cairn_${GOOS}_${GOARCH}.tar.gz" cairn
            rm dist/cairn
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
